# ============================================================
# TempMail 临时邮箱平台 - Docker Compose
# 高并发架构: PostgreSQL + PgBouncer + Redis + Go API + Postfix
# ============================================================
#
# ╔══════════════════════════════════════════════════════════════╗
# ║                          端口速查表                           ║
# ╠══════════════╦════════════╦══════════════════════════════════╣
# ║ 端口         ║  服务       ║ 说明                             ║
# ╠══════════════╬════════════╬══════════════════════════════════╣
# ║ 80  (对外)   ║ frontend   ║ 用户访问的 Web 界面                ║
# ║ 8080(对外)   ║ api        ║ Go API（建议生产环境关闭对外）      ║
# ║ 25  (对外)   ║ postfix    ║ SMTP 收信，必须对外开放            ║
# ╠══════════════╬════════════╬══════════════════════════════════╣
# ║ 5432(内部)   ║ postgres   ║ 数据库，仅容器内互通             ║
# ║ 6432(内部)   ║ pgbouncer  ║ 连接池，仅容器内互通             ║
# ║ 6379(内部)   ║ redis      ║ 缓存，仅容器内互通               ║
# ╚══════════════╩════════════╩══════════════════════════════════╝
#
# ★ 想修改对外端口？格式是 "宿主机端口:容器内端口"
#   只改冒号左边（宿主机端口），右边不要动。
#   例如把 Web 改到 8888：  ports: ["8888:80"]
#   但改了之后记得同步修改所有相关文件，详见各端口注释。
#
name: tempmail

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ==================== PgBouncer (连接池) ====================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-64}
      PGBOUNCER_MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-16}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-16}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ==================== Redis ====================
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--tcp-backlog"
      - "511"
      - "--timeout"
      - "300"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ==================== Go API 服务 ====================
  api:
    image: ghcr.io/${DOCKER_IMAGE_NAMESPACE:-123nhh}/tempmail-api:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: ./api
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      DB_DSN: ${API_DB_DSN}
      DB_MAX_CONNS: ${API_DB_MAX_CONNS:-128}
      DB_MIN_CONNS: ${API_DB_MIN_CONNS:-16}
      DELIVERY_BATCH_ENABLED: ${API_DELIVERY_BATCH_ENABLED:-true}
      DELIVERY_BATCH_MAX: ${API_DELIVERY_BATCH_MAX:-64}
      DELIVERY_BATCH_WAIT: ${API_DELIVERY_BATCH_WAIT:-1ms}
      REDIS_ADDR: ${API_REDIS_ADDR}
      REDIS_PASSWORD: ${API_REDIS_PASSWORD}
      RATE_LIMIT: ${API_RATE_LIMIT}
      RATE_WINDOW: ${API_RATE_WINDOW}
      PORT: ${API_PORT}
      SMTP_SERVER_IP: ${SMTP_SERVER_IP}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}
      LINUXDO_CLIENT_ID: ${LINUXDO_CLIENT_ID:-}
      LINUXDO_CLIENT_SECRET: ${LINUXDO_CLIENT_SECRET:-}
      LINUXDO_REDIRECT_URL: ${LINUXDO_REDIRECT_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      ADMIN_KEY_FILE: ${ADMIN_KEY_FILE:-/data/admin.key}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal

  # ==================== 前端 Nginx ====================
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8888}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - internal

  # ==================== Postfix 收件服务 ====================
  postfix:
    image: ghcr.io/${DOCKER_IMAGE_NAMESPACE:-123nhh}/tempmail-postfix:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: postfix/Dockerfile
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${SMTP_HOST_PORT:-25}:25"
    volumes:
      - postfix_spool:/var/spool/postfix
    environment:
      DB_DSN: ${API_DB_DSN}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}
      API_URL: http://api:8080
      POSTFIX_DEFAULT_PROCESS_LIMIT: ${POSTFIX_DEFAULT_PROCESS_LIMIT:-500}
      POSTFIX_SMTPD_PROCESS_LIMIT: ${POSTFIX_SMTPD_PROCESS_LIMIT:-200}
      POSTFIX_SMTPD_CLIENT_CONNECTION_COUNT_LIMIT: ${POSTFIX_SMTPD_CLIENT_CONNECTION_COUNT_LIMIT:-200}
      POSTFIX_SMTPD_CLIENT_CONNECTION_RATE_LIMIT: ${POSTFIX_SMTPD_CLIENT_CONNECTION_RATE_LIMIT:-0}
      POSTFIX_DEFAULT_DESTINATION_CONCURRENCY_LIMIT: ${POSTFIX_DEFAULT_DESTINATION_CONCURRENCY_LIMIT:-200}
      POSTFIX_LMTP_DESTINATION_CONCURRENCY_LIMIT: ${POSTFIX_LMTP_DESTINATION_CONCURRENCY_LIMIT:-128}
      LMTP_HTTP_MAX_IDLE_CONNS: ${LMTP_HTTP_MAX_IDLE_CONNS:-512}
      LMTP_HTTP_MAX_IDLE_CONNS_PER_HOST: ${LMTP_HTTP_MAX_IDLE_CONNS_PER_HOST:-256}
      LMTP_HTTP_MAX_CONNS_PER_HOST: ${LMTP_HTTP_MAX_CONNS_PER_HOST:-512}
    depends_on:
      pgbouncer:
        condition: service_started
    networks:
      - internal

volumes:
  pgdata:
  postfix_spool:

networks:
  internal:
    driver: bridge
